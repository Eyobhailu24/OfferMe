# Run from the repository root with: docker compose -f backend/deployment/compose.example.yml --env-file backend/.env.production up -d --build
# Configure an external PostgreSQL instance, approved media storage and TLS proxy first.
services:
  api:
    build: {context: .., dockerfile: Dockerfile}
    env_file: ../.env.production
    environment: {HOST: 0.0.0.0, NODE_ENV: production}
    ports: ['127.0.0.1:4100:4100']
    restart: unless-stopped
    command: ['node', 'dist/src/main.js']
  worker:
    build: {context: .., dockerfile: Dockerfile}
    env_file: ../.env.production
    environment: {NODE_ENV: production}
    command: ['node', 'dist/src/worker.js']
    restart: unless-stopped
  website:
    build:
      context: ../../website
      args:
        API_URL: http://api:4100
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_API_URL}
        SITE_URL: ${SITE_URL}
    environment:
      API_URL: http://api:4100
      SITE_URL: ${SITE_URL}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      ANDROID_SHA256_FINGERPRINTS: ${ANDROID_SHA256_FINGERPRINTS:-}
    ports: ['127.0.0.1:3100:3100']
    restart: unless-stopped
