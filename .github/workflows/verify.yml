name: Verify OFFERME
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: offerme
          POSTGRES_PASSWORD: offerme_ci_only
          POSTGRES_DB: offerme_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U offerme -d offerme_dev"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://offerme:offerme_ci_only@127.0.0.1:5432/offerme_dev
      BETTER_AUTH_SECRET: offerme-ci-only-secret-at-least-32-characters
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            website/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: website
      - run: npm run typecheck && npm test && npm run build && npm run contracts
        working-directory: backend
        env:
          PG_TOOL_CONTAINER: ${{ job.services.postgres.id }}
      - run: git diff --exit-code -- backend/contracts website/src/lib/api-schema.d.ts app/api-schema.d.ts
      - run: npm run typecheck && npm run test:unit && npm run check:locales && npm run build
        working-directory: website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - run: npm run test:e2e
        working-directory: website
      - run: npm audit --audit-level=moderate
        working-directory: backend
      - run: npm audit --audit-level=moderate
        working-directory: website
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: website/test-results
          retention-days: 7
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx expo install --check
        working-directory: app
      - run: npm run typecheck && npm run check:jsx && npm run check:locales && npm test && npm run check:fingerprint && npm run export
        working-directory: app
      - run: npm audit --audit-level=moderate
        working-directory: app
